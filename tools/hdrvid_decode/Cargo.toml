[package]
name = "hdrvid_decode"
version = "0.0.0"
edition = "2024"
publish = false
description = "HDRVID stimulus reconstruction: rav1d-safe AV1 decode or raw 10-bit YUV input -> 8 uniform frames -> BT.2020 limited YCbCr to full-range PQ R'G'B' (zenavif recipe) -> Lanczos-3 display frame (zenresize) -> 16-bit PNG (zenpng)."
license = "AGPL-3.0-or-later"

# Standalone research tool: not a member of the zensim workspace. Every imazen
# dependency is pinned to an exact upstream commit so a decode is reproducible
# from this manifest and Cargo.lock alone (no sibling checkout is read).
[workspace]

[dependencies]
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "f3132ee6f9c37310291168b28751f2926ceedb8e", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# `_dev` exposes the canonical decode-side YUV->RGB recipe (`yuv_convert`) that
# zenavif's own AV1 decode path uses; nothing else from zenavif is used.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "85dd0d2b609ba0d49ebf70330b6fcf4f337bbd67", default-features = false, features = ["_dev"] }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "e3975fb9d6d6b7baa96038a0eb8e27febb37c012" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "37c942ed5cbe34d8fee8e1e768fef6b0f99ed374" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "c56e7940f4a123fb653bc60593376cf2eaed3e70", features = ["transfer"] }
imgref = "1.12.0"
rgb = { version = "0.8.52", features = ["bytemuck"] }
enough = "0.4.3"
serde_json = "1.0.150"
sha2 = "0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
