[package]
name = "shipgates-judge"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Keep judge/source-preparation builds independent of optional sweep, training,
# codec and GPU tool dependencies. Numerical owners match the bench prototype.
[dependencies]
zensim = { path = "../../zensim", default-features = false, features = ["threads", "avx512", "imgref", "deprecated-profiles", "feature-regime-v2", "candidate-profiles", "corruption-head", "custom-profiles"] }
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "f0903489300aea240ffae2e3f1359f8f2b9a0ba4" }
zenpng = { version = "=0.1.4", default-features = false }
fast-ssim2 = { version = "=0.8.2", features = ["imgref"] }
butteraugli = { version = "=0.9.3", features = ["avx512"] }
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }
zenpixels-convert = "=0.2.16"
enough = "=0.4.5"
imgref = "=1.12.3"
rgb = { version = "=0.8.53", default-features = false, features = ["bytemuck"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
csv = "=1.4.0"

[patch.crates-io]
# Existing unpublished dependency chain; freeze this sibling before measuring.
zenpixels = { path = "../../../zenpixels/zenpixels" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "4fda439133d465246174b55f62426dc54ef204dd" }

[[bin]]
name = "shipgates_judge"
path = "../../zensim-bench/examples/shipgates_judge.rs"

[[bin]]
name = "shipgates_prepare_source"
path = "../../zensim-bench/examples/shipgates_prepare_source.rs"

[profile.release]
lto = "thin"
codegen-units = 1
