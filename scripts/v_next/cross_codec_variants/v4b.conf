# EXP-CROSS-CODEC-V4b config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# V4 finding (n=6 bakes): multi-codec anchor at weight=1.0 + step_p=0.15
# pulls so hard toward score=63 that the q-sweep dynamic range collapses
# to 8-16 score units (gate >= 50). The cross-codec calibration is
# excellent (cc_std median 0.10-0.14) but mono/range fail.
#
# V4b: drop anchor_loss_weight and anchor_step_p to give the per-pair
# MSE objective room to spread the output range:
#   --anchor-loss-weight {0.05, 0.10}     (V4 used 1.0)
#   --anchor-step-p 0.05                  (V4 used 0.15)
#
# Hypothesis: the tanh pin + sigma-floor structurally allow [0, 100] range
# expression; only the over-weighted anchor was compressing it. With
# a 10-20x weaker anchor, per-pair MSE drives the range to native
# [5, 95] while anchor still provides cross-codec calibration signal.
#
# Args: <seed> <anchor_w>
# Bakes: cc4v4b_s<SEED>_a<W>.bin

EXP_LABEL="EXP-CROSS-CODEC-V4b"
OUT_SUBDIR="exp_cross_codec_v4b_2026-05-19"
ANCHOR_REL="2026-05-19-multi-codec-jnd-anchors/anchors_multi_codec_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=10.0
MONOTONICITY_REG=1.0
ANCHOR_STEP_P=0.05
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.5
DYN_RANGE_SIGMA_THRESHOLD=20.0

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed> <anchor_w>}"
    ANCHOR_LOSS_WEIGHT="${2:?usage: ${CC_ENTRY} <seed> <anchor_w>}"
    CC_ARG_SUMMARY="seed=${SEED} anchor_w=${ANCHOR_LOSS_WEIGHT}"
}

cc_bake_stem() { printf 'cc4v4b_s%s_a%s' "${SEED}" "${ANCHOR_LOSS_WEIGHT/./_}"; }
