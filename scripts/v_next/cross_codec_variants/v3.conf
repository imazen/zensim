# EXP-CROSS-CODEC-V3 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# Builds on V2 with three architectural additions to fix the
# "collapse to constant ~63" failure mode (V2 falsified for Tuner trail
# on dynamic range; see
# benchmarks/v_tuner_v2_cross_codec_2026-05-19_falsification.md):
#
#   1. --cross-codec-rank-preserve-weight 0.2: RankNet on equiv pairs
#      that have non-zero butter_diff, weighted by |butter_diff|.
#      Pushes back against (y_a - y_b)^2 collapse.
#
#   2. --dynamic-range-floor-weight 0.2: sigma-floor probe (40 random
#      A-side equiv rows forwarded, penalty when sigma < 15 score units).
#      Structurally requires output spread.
#
#   3. --monotonicity-reg 5.0: 10x stronger mono push (V2 used 0.5,
#      Tuner-v2 used 1.0 -> range 89.68). Higher reg fights collapse.
#
# Args: <seed> <W>   (W = cross_codec_eq_weight)
# Bakes: cc4v3_s<SEED>_w<W>.bin

EXP_LABEL="EXP-CROSS-CODEC-V3"
OUT_SUBDIR="exp_cross_codec_v3_2026-05-19"
ANCHOR_REL="2026-05-19-jnd-anchors/anchors_372col.parquet"

MONOTONICITY_REG=5.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_EQ_WEIGHT="${2:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_ARG_SUMMARY="seed=${SEED} W=${CC_EQ_WEIGHT}"
}

cc_bake_stem() { printf 'cc4v3_s%s_w%s' "${SEED}" "${CC_EQ_WEIGHT/./_}"; }
