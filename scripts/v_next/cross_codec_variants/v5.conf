# EXP-CROSS-CODEC-V5 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# V4b found: 4 of 5 Tuner gates pass with anchor_w=0.05 + step_p=0.05
# but range stalls at 35.25 vs gate 50. Root cause: single-target
# multi-codec anchor at score=63 pulls all outputs toward 63.
#
# V5: piecewise multi-band anchor. The anchor parquet has 6 anchor
# bands per (source, codec) at distinct butter levels x distinct
# target scores. The trainer reads target_score per-row from the
# parquet. Each band provides a calibration landmark at a different
# region of [0, 100], forcing the network to span the full range
# while preserving V4-style cross-codec parity at each band.
#
# Key V5 changes vs V4b:
#   --anchor-parquet      -> multi-band anchors (6 bands x 4 codecs x ~1000 sources)
#   --tanh-output-head-scale 15.0   (V4b used 10.0 — wider linear region for [5, 95])
#   --anchor-loss-weight  -> 0.05 (same as V4b; sum across 6 bands gives stronger signal)
#   --anchor-step-p 0.15  (V5 raise from V4b's 0.05 — match V4 design doc)
#
# The trainer auto-detects the `target_score` column on the parquet
# and switches to per-row target. No CLI change for per-row mode.
#
# SPEED-B (2026-05-19, task #165): K=1 asserts in mlp_train.rs aux
# loss steps were lifted; --minibatch-size 32 now WORKS but produces
# DIFFERENT (worse) SROCC vs K=1 on held-out corpora at this recipe's
# default lr (CID22 -0.05, KADID -0.17 in one-seed test). Default
# KBATCH=1 preserves the historical recipe's quality. Set KBATCH=32
# for ~2.2x wall-time speedup IF you've re-tuned lr (try lr * sqrt(K))
# or accept the bake-quality regression.
#
# Args: <seed>
# Bakes: cc4v5_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V5"
OUT_SUBDIR="exp_cross_codec_v5_2026-05-19"
ANCHOR_REL="2026-05-19-multi-band-anchors/anchors_multi_band_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=15.0
MONOTONICITY_REG=1.0
ANCHOR_LOSS_WEIGHT=0.05
ANCHOR_STEP_P=0.15
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED}"
}

cc_bake_stem() { printf 'cc4v5_s%s' "${SEED}"; }
