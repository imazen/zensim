# EXP-CROSS-CODEC-V6 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# V5 (commit e0d869f) passes 5 of 6 Tuner gates spectacularly — only
# `median_range >= 50` fails (V5 outputs clustered in [37, 70]). Per
# V5 falsification doc V6 candidate #1: increase anchor pressure to
# force band targets to materialize as actual output values.
#
# Single architectural change from V5:
#   --anchor-loss-weight  ->  <anchor_w>   (V5 used 0.05)
#   --anchor-step-p       ->  <anchor_p>   (V5 used 0.15)
#
# Everything else identical to V5 (multi-band anchor parquet,
# cross-codec equiv pool, per-sample-alpha head, tanh scale 15.0,
# dyn-range floor, monotonicity reg).
#
# SPEED-B (2026-05-19, task #165): --minibatch-size 32 now WORKS but
# produces DIFFERENT (worse) SROCC vs K=1 on held-out corpora at
# this recipe's default lr. Default KBATCH=1 preserves the historical
# quality. Set KBATCH=32 for ~2.2x wall-time speedup IF you've
# re-tuned lr (try lr * sqrt(K)) or accept the bake-quality regression.
#
# Args: <seed> <anchor_loss_weight> <anchor_step_p>
# Bakes: cc4v6_w<W>_p<P>_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V6"
OUT_SUBDIR="exp_cross_codec_v6_2026-05-19"
ANCHOR_REL="2026-05-19-multi-band-anchors/anchors_multi_band_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=15.0
MONOTONICITY_REG=1.0
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed> <anchor_w> <anchor_p>}"
    ANCHOR_LOSS_WEIGHT="${2:?usage: ${CC_ENTRY} <seed> <anchor_w> <anchor_p>}"
    ANCHOR_STEP_P="${3:?usage: ${CC_ENTRY} <seed> <anchor_w> <anchor_p>}"
    CC_ARG_SUMMARY="seed=${SEED} anchor_w=${ANCHOR_LOSS_WEIGHT} anchor_p=${ANCHOR_STEP_P}"
}

# Encode anchor_w / anchor_p in the bake name: dots become 'p' for
# filesystem-friendliness.
cc_bake_stem() {
    local w_tag p_tag
    w_tag=$(printf '%s' "${ANCHOR_LOSS_WEIGHT}" | tr '.' 'p')
    p_tag=$(printf '%s' "${ANCHOR_STEP_P}" | tr '.' 'p')
    printf 'cc4v6_w%s_p%s_s%s' "${w_tag}" "${p_tag}" "${SEED}"
}
