# EXP-CROSS-CODEC-V9 config (2026-05-20). Driven by ../run_cross_codec_seed.sh.
#
# V6/V8 recipe with the V9 anchor parquet (8 bands, [0, 100] range, JND
# at 60, JOD at 30). The per-row target_score column in the V9 anchor
# parquet supplies the band-specific score targets; --anchor-target-score
# is the fallback for non-targeted rows.
#
# Hyperparameter deltas from the V6 ship recipe:
#   --anchor-loss-weight 0.5 (down from 1.0): 8 bands vs 6 means more
#     anchor rows; reduce per-row pressure proportionally.
#   --tanh-output-head-scale 20.0 (up from 15.0): widen active linear
#     region to cover the full [0, 100] span without saturation.
#   --dynamic-range-sigma-threshold 25.0 (up from 15.0): encourage
#     wider score spread.
#
# Uses SPEED-B K=32 lr=5.66e-3 (verified clean by V6-RESHIP).
#
# Args: <seed>
# Env:  KBATCH (default 32), LR_OVERRIDE (default 5.66e-3)
# Bakes: cc4v9_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V9"
OUT_SUBDIR="exp_cross_codec_v9_2026-05-20"
ANCHOR_REL="2026-05-20-v9-anchors/anchors_v9_372col.parquet"

KBATCH_DEFAULT=32
LR_DEFAULT=5.66e-3
TANH_OUTPUT_HEAD_SCALE=20.0
MONOTONICITY_REG=1.0
ANCHOR_LOSS_WEIGHT=0.5
ANCHOR_TARGET_SCORE=60.0
ANCHOR_STEP_P=0.30
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.3
DYN_RANGE_SIGMA_THRESHOLD=25.0

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED} KBATCH=${KBATCH:-${KBATCH_DEFAULT}} LR=${LR_OVERRIDE:-${LR_DEFAULT}}"
}

cc_bake_stem() { printf 'cc4v9_s%s' "${SEED}"; }
