# EXP-CROSS-CODEC-V8 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# V6 recipe with the V8 anchor parquet (4 bands, ssim2=63 PJND anchored
# at butter=2.5 instead of V6/V7's butter=1.5). Heavy-distortion bands
# (4.0+ in V6, 6.0 in V7) dropped — only butter in {0.5, 1.0, 2.5, 4.0}.
#
# All other hyperparameters identical to the V6 ship recipe.
#
# Args: <seed>
# Bakes: cc4v8_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V8"
OUT_SUBDIR="exp_cross_codec_v8_2026-05-19"
ANCHOR_REL="2026-05-19-v8-anchors/anchors_v8_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=15.0
MONOTONICITY_REG=1.0
ANCHOR_LOSS_WEIGHT=1.0
ANCHOR_STEP_P=0.30
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED}"
}

cc_bake_stem() { printf 'cc4v8_s%s' "${SEED}"; }
