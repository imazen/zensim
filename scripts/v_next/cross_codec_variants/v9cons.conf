# EXP-CROSS-CODEC-V9 conservative-recipe config (2026-05-20).
# Driven by ../run_cross_codec_seed.sh; entry point
# ../run_cross_codec_v9_conservative.sh.
#
# V9's own deltas (tanh 20.0 / anchor_w 0.5 / sigma 25.0) backed out to the
# V6/V8-shipped values, keeping only the V9 anchor parquet and the SPEED-B
# K=32 lr=5.66e-3 pair. The conservative arm of the same wave: it isolates
# "is the V9 anchor helping?" from "are the V9 hyperparameter deltas
# helping?", which the base recipe confounds.
#
# Deltas vs v9.conf: tanh 15.0 (v9 20.0), anchor_loss_weight 1.0 (v9 0.5),
# dyn-range floor 0.2 / sigma 15.0 (v9 0.3 / 25.0).
#
# Args: <seed>
# Bakes: cc4v9_cons_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V9 conservative-recipe"
OUT_SUBDIR="exp_cross_codec_v9_2026-05-20"
ANCHOR_REL="2026-05-20-v9-anchors/anchors_v9_372col.parquet"

KBATCH_DEFAULT=32
LR_DEFAULT=5.66e-3
TANH_OUTPUT_HEAD_SCALE=15.0
MONOTONICITY_REG=1.0
ANCHOR_LOSS_WEIGHT=1.0
ANCHOR_TARGET_SCORE=60.0
ANCHOR_STEP_P=0.30
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2
DYN_RANGE_SIGMA_THRESHOLD=15.0

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED}"
}

cc_bake_stem() { printf 'cc4v9_cons_s%s' "${SEED}"; }
