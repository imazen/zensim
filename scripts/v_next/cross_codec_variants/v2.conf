# EXP-CROSS-CODEC-V2 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# Builds on EXP-CROSS-CODEC-METRIC (the W=1.0 seed=1 ship that landed at
# T=63 cross-codec butter 4.82/5.52 — close but not strict < 2.5). V2
# tightens the equivalence pool (max butter gap 0.3 vs 0.5), rebalances
# the avif<->X pool with a 2x row-weight oversample, and extends to 30
# butter levels giving a 68,788-pair pool (vs original 57,972).
#
# Args: <seed> <W>   (W = cross_codec_eq_weight)
# Bakes: cc4v2_s<SEED>_w<W>.bin

EXP_LABEL="EXP-CROSS-CODEC-V2"
OUT_SUBDIR="exp_cross_codec_v2_2026-05-19"
ANCHOR_REL="2026-05-19-jnd-anchors/anchors_372col.parquet"

MONOTONICITY_REG=0.5

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_EQ_WEIGHT="${2:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_ARG_SUMMARY="seed=${SEED} W=${CC_EQ_WEIGHT}"
}

# Sanitize W for the filename (replace . with _)
cc_bake_stem() { printf 'cc4v2_s%s_w%s' "${SEED}" "${CC_EQ_WEIGHT/./_}"; }
