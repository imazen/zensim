# EXP-CROSS-CODEC-V4 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# Builds on V3 with TWO architectural counterweights to close the V3
# mono-violation gap (best V3 strict mono 0.9100 vs gate 0.9378):
#
#   1. --tanh-output-head-scale 10.0 (V4-C from V3 falsification doc):
#      wraps the per-sample-alpha head output in `y_score = 100*sigma(y_pre/scale)`,
#      eliminating the post-affine beta-amplification path that V3 identified
#      as the dominant mono-violation cause.
#
#   2. --anchor-parquet anchors_multi_codec_372col.parquet (V4 user
#      directive): replaces V3's single-codec (zenjpeg) PJND anchor with a
#      multi-codec anchor — 1000 sources x 4 codecs at each codec's PJND-q,
#      all targeting score=63. Binds score=63 <-> PJND across codecs.
#
# Plus V3 falsification finding: --monotonicity-reg 1.0 (NOT 5.0). The
# sigma-floor already prevents collapse structurally, so strong mono-reg is
# counterproductive (V4-B from falsification doc).
#
# Args: <seed> <W>   (W = cross_codec_eq_weight)
# Bakes: cc4v4_s<SEED>_w<W>.bin

EXP_LABEL="EXP-CROSS-CODEC-V4"
OUT_SUBDIR="exp_cross_codec_v4_2026-05-19"
# V4: multi-codec PJND anchor (4000 rows = 1000 sources x 4 codecs).
ANCHOR_REL="2026-05-19-multi-codec-jnd-anchors/anchors_multi_codec_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=10.0
MONOTONICITY_REG=1.0
ANCHOR_STEP_P=0.15
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_EQ_WEIGHT="${2:?usage: ${CC_ENTRY} <seed> <W>}"
    CC_ARG_SUMMARY="seed=${SEED} W=${CC_EQ_WEIGHT}"
}

cc_bake_stem() { printf 'cc4v4_s%s_w%s' "${SEED}" "${CC_EQ_WEIGHT/./_}"; }
