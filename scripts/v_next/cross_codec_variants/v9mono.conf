# EXP-CROSS-CODEC-V9 mono-recovery follow-up config (2026-05-20).
# Driven by ../run_cross_codec_seed.sh; entry point
# ../run_cross_codec_v9_mono_recovery.sh.
#
# V9 K=32 base recipe failed the mono >= 0.9378 gate at 0.60-0.66.
# Hypothesis: increasing --monotonicity-reg + --monotonicity-margin
# tightens the in-curve gradient signal and closes the gap, at the
# cost of dial range (some range vs mono tradeoff).
#
# This variant: --monotonicity-reg 5.0 (up from 1.0)
#               --monotonicity-margin 0.5 (up from 0.0)
# Same as V9-K=32 otherwise.
#
# Args: <seed>
# Bakes: cc4v9_mono_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V9 mono-recovery"
OUT_SUBDIR="exp_cross_codec_v9_2026-05-20"
ANCHOR_REL="2026-05-20-v9-anchors/anchors_v9_372col.parquet"

KBATCH_DEFAULT=32
LR_DEFAULT=5.66e-3
TANH_OUTPUT_HEAD_SCALE=20.0
MONOTONICITY_REG=5.0
MONOTONICITY_MARGIN=0.5
ANCHOR_LOSS_WEIGHT=0.5
ANCHOR_TARGET_SCORE=60.0
ANCHOR_STEP_P=0.30
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.3
DYN_RANGE_SIGMA_THRESHOLD=25.0

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED}"
}

cc_bake_stem() { printf 'cc4v9_mono_s%s' "${SEED}"; }
