# EXP-CROSS-CODEC-V7 config (2026-05-19). Driven by ../run_cross_codec_seed.sh.
#
# Replaces V6's rule-of-thumb anchor target_score column with the V7
# empirically-derived per-(codec, band) median ssim2 from the canonical
# ssim2 + cvvdp score parquets. Empirical medians live HIGHER than V6
# rules of thumb at every band except 0.3 — V6 was biasing the bake
# to predict scores BELOW where human-validated metrics land at the
# same butter level.
#
# Single change from V6: the anchor parquet now points at
#   2026-05-19-empirical-band-anchors/anchors_empirical_372col.parquet
# Every other hyperparameter identical to the V6 ship (cc4v6_w1p0_p0p30_s1)
# with anchor_w=1.0 step_p=0.30.
#
# SPEED-B: KBATCH=1 default per the same constraint the V6 ship has.
#
# Args: <seed>
# Bakes: cc4v7_s<SEED>.bin

EXP_LABEL="EXP-CROSS-CODEC-V7"
OUT_SUBDIR="exp_cross_codec_v7_2026-05-19"
ANCHOR_REL="2026-05-19-empirical-band-anchors/anchors_empirical_372col.parquet"

TANH_OUTPUT_HEAD_SCALE=15.0
MONOTONICITY_REG=1.0
ANCHOR_LOSS_WEIGHT=1.0
ANCHOR_STEP_P=0.30
CC_EQ_WEIGHT=1.0
CC_RANK_PRESERVE_WEIGHT=0.2
DYN_RANGE_FLOOR_WEIGHT=0.2

cc_parse_args() {
    SEED="${1:?usage: ${CC_ENTRY} <seed>}"
    CC_ARG_SUMMARY="seed=${SEED}"
}

cc_bake_stem() { printf 'cc4v7_s%s' "${SEED}"; }
