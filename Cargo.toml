[workspace]
resolver = "2"
members = ["zensim", "zensim-experimental", "zensim-validate", "zensim-regress", "zensim-bench", "zensim-wasm-tests", "zensim-train-core", "zensim-train-gpu", "zensim-picker-prep", "zensim-target"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
zensim = { version = "0.3.0", path = "zensim", default-features = false }
zensim-regress = { version = "0.4.0", path = "zensim-regress", default-features = false }
archmage = { version = "0.9.23", features = ["macros", "avx512"] }
magetypes = { version = "0.9.23", features = ["avx512"] }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
thiserror = "2"
image = "0.25"
rayon = "1.10"
imgref = "1.12"
rgb = { version = "0.8", default-features = false, features = ["bytemuck"] }
linear-srgb = { version = "0.6.7", default-features = false, features = ["std"] }
codec-corpus = "1.0.3"
zenbench = "0.1.2"
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }
zenpng = { version = "0.1.4", default-features = false }
zenpixels = { version = "0.2.10", default-features = false }
zenblend = "0.1.3"
enough = { version = "0.4.2", default-features = false, features = ["std"] }
# zenpredict / zenpredict-bake live in sibling `zenanalyze` (not on crates.io).
# Pinned to a specific git rev for CI portability (no sibling-clone needed).
# Local developers wanting auto-sync with the sibling worktree should add
# a `[patch]` section to their personal `.cargo/config.toml`:
#     [patch."https://github.com/imazen/zenanalyze"]
#     zenpredict      = { path = "../zenanalyze/zenpredict" }
#     zenpredict-bake = { path = "../zenanalyze/zenpredict-bake" }
# Bump the rev deliberately when a zenanalyze fix zensim needs lands.
zenpredict      = { git = "https://github.com/imazen/zenanalyze", rev = "9a9be8200f26f643b45338711426cacae820f3a1" }
zenpredict-bake = { git = "https://github.com/imazen/zenanalyze", rev = "9a9be8200f26f643b45338711426cacae820f3a1" }

# zenstats — canonical IQA-stats home extracted on 2026-05-26 from the
# pre-existing `zensim-validate/src/panel.rs`. Lives in the zenmetrics
# repo as a self-contained workspace member (zenmetrics already depends
# on zensim, so the dep direction is zensim → zenmetrics/crates/zenstats
# only — no cycle, the zenmetrics workspace root is NOT pulled in).
# Local developers wanting auto-sync with the sibling worktree use the
# path dep below; CI portability would need a git ref the day this is
# published, but until then we rely on the sibling clone being present.
zenstats = { path = "../zenmetrics/crates/zenstats", default-features = false, features = ["parallel"] }

# jxl-encoder 0.3.2 (lossy-JPEG recompression API) is required by the sibling
# `zenjxl` path-dep that `zensim-bench`'s optional `extract-omni` feature
# pulls in, but 0.3.2 is not yet published to crates.io (max published 0.3.1).
# zenjxl carries its OWN `[patch.crates-io] jxl-encoder = path` — but a
# dependency's patch table is ignored; only the workspace ROOT's patch
# applies. So we re-declare it here. The local jxl-encoder sibling is 0.3.2.
# This matches the existing "extract-omni builds require sibling checkouts"
# contract (zensim already needs sibling clones for zenstats above).
[patch.crates-io]
jxl-encoder = { path = "../jxl-encoder/jxl-encoder" }
