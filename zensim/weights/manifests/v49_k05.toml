[inputs.konjnd_dense]
path   = "{canonical}/konjnd-dense-norm.parquet"
sha256 = "49b65c4890fb9a8f910c5cbf873d75714d47407b5babcf6e8f7fb0df67684c85"
rows   = 20160

[inputs.kadis]
