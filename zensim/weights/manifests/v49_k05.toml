sha256 = "5d0e066d2afefc4b5daefaa56a41e8d924e99db3e3e177dd78634eaabe5f58df"
notes  = "Per-feature sign mask: 300 pin_geq0 (sign-safe, W1≥0) / 72 free. Drives --monotone-cbc + --monotone-strict."

[inputs.auto_transforms]
path   = "benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
sha256 = "ada1f1ce1b649b870de14b5bb47f782c1335a0e21942f5ba7697b32096d36ccc"

[eval]
verdict_file  = "../../../benchmarks/v0_qat_native_methodology_2026-05-27.md"
cid22_srocc   = 0.8657   # QAT-native (bake_verdict), best of the v47 axiom-clean candidates
kadid_srocc   = 0.7933
tid_srocc     = 0.7927
konjnd_srocc  = 0.4185   # f16+zerobias removes fine-weight PJND precision (intrinsic; non-QAT recal keeps 0.485)
aic3_srocc    = 0.7680
aic4_srocc    = 0.8854
qsweep_monotonicity = 0.9433  # JPEG 50img×19q, vs V39 0.6767 (V39 dial broken: median→0 q55–q95)
identity      = 97.69    # the dial max; V39 BROKEN (identity=0 on every ref)
blur_above_identity = 0  # the V39 defect, FIXED by construction
notes = "Costs vs V39 (rank only): CID22 -0.014, KADID -0.132, TID -0.139, KonJND -0.001, AIC-3/4 -0.034/-0.020 — the 72 dropped sign-flip features' analytic-distortion signal + f16 PJND precision. Gains: blur>identity FIXED, identity=max FIXED (V39 scores 0), monotone codec dial (q-sweep 94.3% vs V39 67.7%, 0.33% vs 53.6% tied), 27 KB vs 257 KB, native one-pass packing. V39's higher KADID/TID rank is moot for the dial use case (its dial is non-invertible). Ship decision (replace V39 at Profile::A vs add sibling) USER-GATED — see methodology doc."
