# Recipe for the masked-monotone v47-strict bake — the production-recipe
# axiom-clean metric that fixes the V39 blur>identity defect (monotone-by-
# construction: 0 inversions, identity=max). v47-strict = the V39/V32 recipe
# + masked-monotone (--monotone-cbc + per-feature sign mask + strict).
#
# Reproduce:  zensim_mlp_train --manifest zensim/weights/manifests/v47_strict.toml
# (TOML recipe replaces the 25-flag scripts/v_next/run_v47_masked_strict_*.sh.)
# Schema: zensim/weights/manifests/README.md

[bake]
name              = "v47-strict-QAT (masked-monotone + quantization-aware fine-tune)"
internal_version  = "v47-strict-qat"
file              = "/mnt/v/output/zensim/bakes/v47_strict_qat_2026-05-27.bin"
sha256            = "c71b2060023638b1a5d57341997b81e9aac55666abb9e14f3347cb0b00846470"
file_bytes        = 257947
n_inputs          = 372
arch              = "372 → 128 → 64 + per-sample-α + tanh-pin(scale=30), masked-monotone (W1≥0 on sign-safe set, rank_w≤0); spline + pack applied post-training"
date              = "2026-05-27"

[training]
trainer            = "zensim_mlp_train"
seed               = 17
mse_weight         = 0.6
ranknet_weight     = 0.6
monotonicity_reg   = 1.0
tanh_output_head_scale = 30.0
anchor_loss_weight = 0.01        # post-training spline-fit weight; NOT a training target
anchor_step_p      = 0.05
hidden             = 128
n_hidden_layers    = 2
per_sample_alpha_head = true
epochs             = 200
lr                 = 0.001
l2                 = 0.0001
target_column      = "human_score"   # per-group normalized to [0,1]
target_scale       = 1.0
max_features       = 372
minibatch_size     = 32
val_aggregate      = "geomean3"
out_dtype          = "f16"           # QAT: ship f16+zerobias (the net trains robust to it)
monotone_cbc       = true
monotone_strict    = true
qat_fine_tune_epochs = 40            # last 40 of 200 epochs train quantization-aware (f16+zerobias STE)
qat_tau            = 0.005
monotone_feature_mask = "../../../benchmarks/feature_sign_mask_2026-05-26.tsv"

groups = [
    { name = "safesyn",      path = "{canonical}/safesyn.parquet",          train_w = 1.0, val_w = 0.5 },
    { name = "cid22_train",  path = "{canonical}/cid22_train_norm.parquet", train_w = 1.5, val_w = 2.0 },
    { name = "kadid",        path = "{canonical}/kadid.parquet",            train_w = 0.5, val_w = 1.0 },
    { name = "tid",          path = "{canonical}/tid.parquet",              train_w = 0.5, val_w = 1.0 },
    { name = "konjnd_dense", path = "{canonical}/konjnd-dense-norm.parquet", train_w = 1.2, val_w = 1.5 },
]

auto_transforms = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
anchor_parquet  = "{canonical}/multiband_anchor_dial100.parquet"

steps = [
    "1. zensim_mlp_train --manifest (this file) produces the FINAL packed+calibrated bake in ONE pass — no Python post-steps:",
    "   - last 40 epochs train quantization-aware (f16+zerobias STE) → net robust to packing",
    "   - post-training spline fit (fit_monotone_spline) on the QUANTIZED net over the multiband anchor → dial calibrated to exactly what ships",
    "   - bake stores f16 (encoder) + compressed → ~30 KB, identity-exact, monotone-by-construction",
    "   recal_v47_dial.py + pack_and_calibrate.py are OBSOLETE for this recipe (kept only for non-QAT bakes).",
]

[inputs.canonical_root]
local = "/mnt/v/zen/zensim-training/canonical-2026-05-21/train"
r2    = "s3://zentrain/canonical-2026-05-21/train"
tower = "/mnt/tower/output/zensim-archive-2026-05-20/canonical-2026-05-21/train"

[inputs.safesyn]
path   = "{canonical}/safesyn.parquet"
sha256 = "ad15cc79cde156109d920bfade8ed465908e256fcd1cd8556b430791dcaf1b18"
rows   = 196086

[inputs.cid22_train]
path   = "{canonical}/cid22_train_norm.parquet"
sha256 = "59c9888ae3141545082fb58eafb19d1e964154cf79060b3d033e72ba8227c3ca"
rows   = 17611
notes  = "TRAINING-ONLY subset of the broader CID22 library — NOT the 49-ref held-out validation set. human_score = MCOS/100."

[inputs.kadid]
path   = "{canonical}/kadid.parquet"
sha256 = "83356f034dc83e50495ec3cf7d5c5d6df9588f4e39ba3f4af1208a12a1bdacee"
rows   = 10125

[inputs.tid]
path   = "{canonical}/tid.parquet"
sha256 = "6704de0c7dcec3a1b9e57495c410c91aee1945cd4411fcdb217688af2d5c0e4f"
rows   = 3000

[inputs.konjnd_dense]
path   = "{canonical}/konjnd-dense-norm.parquet"
sha256 = "5595a922b076e7e3fd6d1d8cfcdfbf37a92e3e1603324889cf8ac2e077323898"
rows   = 20160

[inputs.multiband_anchor]
path   = "{canonical}/multiband_anchor_dial100.parquet"
sha256 = "594b3df521e3a2261b64a49fd2df001c1a6a31ff362fdfc4071fb41e06407149"
notes  = "Per-row anchor for post-training PCHIP dial-spline fit (NOT a training target)."

[inputs.feature_sign_mask]
path   = "benchmarks/feature_sign_mask_2026-05-26.tsv"
sha256 = "5d0e066d2afefc4b5daefaa56a41e8d924e99db3e3e177dd78634eaabe5f58df"
notes  = "Per-feature sign mask: 300 pin_geq0 (sign-safe, W1≥0) / 72 free. Drives --monotone-cbc + --monotone-strict."

[inputs.auto_transforms]
path   = "benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
sha256 = "ada1f1ce1b649b870de14b5bb47f782c1335a0e21942f5ba7697b32096d36ccc"

[eval]
verdict_file  = "../../../benchmarks/v47_strict_recal_methodology_2026-05-27.md"
cid22_srocc   = 0.8547   # packed-recal: 0.8564
kadid_srocc   = 0.8030
tid_srocc     = 0.7965
konjnd_srocc  = 0.4850   # best-of-field (> V39 0.420)
aic3_srocc    = 0.7700
aic4_srocc    = 0.8902
blur_above_identity = 0  # the V39 defect, FIXED by construction
notes = "Costs vs V39: CID22 -0.024, KADID -0.122, TID -0.135 (the 72 dropped sign-flip features' analytic-distortion signal). Gains: blur>identity FIXED, monotone dial (q-sweep 94% vs V39 68%), KonJND +0.065, better CID22 calibration. Ship decision (replace V39 at Profile::A vs sibling) PENDING."
