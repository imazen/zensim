# Depth iteration 5 — CORRECTING iteration 4's overclaim. v4 used the NAIVE
# lossy monotone method: all-positive weights + monotone_strict which DELETES
# the 72 non-sign-safe features. This uses PARTIAL monotonicity instead —
# monotone_pin_during_training (KEEP-72): pin the 300 sign-safe features but
# keep the 72 free ones EXPRESSIVE (the standard fix). Plus a gentler penalty
# (reg 0.3, not the max 1.0 v4 used). Maps a real frontier point between
# depth_v2 (rank, no dial) and depth_v4 (dial, no rank).
#
# (v4 header:)
# Depth iteration 4 — decisive "win BOTH panels" test: depth DATA (v2 groups) +
# A/v47 DIAL MACHINERY (per-sample-alpha head + tanh-pin + masked-monotone +
# strict sign mask). depth_v2 won rank via UNCONSTRAINED 2-layer capacity and
# FAILED the dial (mono 0.55, no range); this adds the constraints that give A
# its monotone dial and measures the rank cost. n_hidden_layers stays 2.
#
# (depth_v2 header:)
# Depth iteration 2 — depth_v1 + the two within-ladder fixes iteration 1's
# dashboard diagnosed: HF near-lossless cratered (per-ref −0.911, 100% of refs
# ranked BACKWARDS — the §8.39 inversion; depth_v1 never trained on HF) and
# KonJND regressed −0.074 (konjnd as a PLAIN group teaches between-image scale).
# Both are per-image ladders → :withinref (the 5th group field). konjnd switched
# to withinref; hf_nearlossless_train added withinref.
#
# (depth_v1 header:)
# Depth iteration 1 — 2-hidden-layer MLP, pursuing the blend candidate's
# non-photo win via the RUST trainer (no Python blend_lib), with konjnd-dense
# added back (the group the blend recipe dropped — the likely cause of its
# −0.038 KonJND regression vs B).
#
# Reproduce:  zensim_mlp_train --manifest zensim/weights/manifests/depth_v1.toml
#             --seed <N> --out <path>.bin
#
# Recipe, not a bake record: no [bake].sha256 — see the seed-fork collapse +
# make_manifest.py (a recipe describes HOW to train, not one bake).
#
# vs the Python blend candidate (benchmarks/blend_2layer_methodology_2026-07-15.md):
#   - arch 372→128→64 here (Rust `--n-hidden-layers 2`, 2nd layer = hidden/2)
#     vs the blend's 372→128→128. The FINDING (depth breaks the CID22↔non-photo
#     trade a linear head can't) is what we test, not the exact width.
#   - RankNet loss (the Rust trainer's tested default) vs the blend's smooth_l1.
#     MSE-loss variant is depth_v2 (per-group :mse), compared head-to-head.
#   - + konjnd-dense as a training group (blend omitted it).

[bake]
name             = "depth-v5 (partial-monotone KEEP-72 + gentle reg)"
internal_version = "depth-v5"
arch             = "372 → 128 → 64 → 1, LeakyReLU(0.01), identity out; winsor_p99 auto-transforms pre-scaler; PCHIP dial spline"

[training]
trainer            = "zensim_mlp_train"
hidden             = 128
n_hidden_layers    = 2
per_sample_alpha_head = true
tanh_output_head_scale = 30.0
monotonicity_reg   = 0.3
monotone_cbc       = true
monotone_pin_during_training = true   # KEEP-72: pin 300 sign-safe, keep 72 free EXPRESSIVE (not drop)
monotone_feature_mask = "../../../benchmarks/feature_sign_mask_2026-05-26.tsv"
epochs             = 160
pairs_per_epoch    = 50000
lr                 = 0.001
l2                 = 0.00001
seed               = 13
target_column      = "human_score"
target_scale       = 100.0
max_features       = 372
minibatch_size     = 32
val_aggregate      = "geomean3"
val_policy         = "min"
out_dtype          = "f32"
auto_transforms    = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
anchor_parquet     = "{canonical}/multiband_anchor_dial100.parquet"
anchor_loss_weight = 0.01
anchor_step_p      = 0.05

[[training.groups]]
name = "safesyn"
path = "{canonical}/safesyn.parquet"
train_w = 1.0
val_w = 0.5

[[training.groups]]
name = "cid22_train"
path = "{canonical}/cid22_train.parquet"
train_w = 1.0
val_w = 2.0

[[training.groups]]
name = "kadid"
path = "{canonical}/kadid.parquet"
train_w = 0.5
val_w = 1.0

[[training.groups]]
name = "tid"
path = "{canonical}/tid.parquet"
train_w = 0.5
val_w = 1.0

[[training.groups]]
name = "konjnd_dense"
path = "{canonical}/konjnd-dense-norm.parquet"
train_w = 1.0
val_w = 1.5
within_ref = true   # PJND is a per-image threshold; cross-image pairing drowns it

[[training.groups]]
name = "hf_nearlossless"
path = "/mnt/v/zen/zensim-training/canonical-2026-07-15/train/hf_nearlossless_train.parquet"
train_w = 0.5
val_w = 0.0
within_ref = true   # near-lossless ladder moves ~0.92 ssim2 pts within-image vs ~6 between

[[training.groups]]
name = "bigcodec"
path = "/mnt/v/output/zensim/depth-iter/bigcodec_train_120k_stride.parquet"
