# Manifest for the shipped `zensim-a` (V39) bake.
# Schema: zensim/weights/manifests/README.md

[bake]
name              = "zensim-a"
internal_version  = "v39"
file              = "../v39_v32plus_spline_seed17_2026-05-25.bin"
sha256            = "72820d662e0b35d109fa4a1403eadea4cf3a551964a1a4113ec0f2ad7ecced63"
file_bytes        = 257955
n_inputs          = 372
arch              = "372 → 128 → 64 + per-sample-α + tanh-pin(scale=30) + PCHIP spline (3-knot, injected post-training)"
output_disposition = "extrapolate_score"  # spline output passed through unclamped at the metric layer; runtime spline ≤100 upper-clamps (negative-below allowed per the corrected spec)
date              = "2026-05-25"
ship_commit       = "a109680"

[training]
trainer            = "zensim_mlp_train"
trainer_commit     = "pre-43b92ae (session 133ab28d)"
seed               = 17
mse_weight         = 0.6
ranknet_weight     = 0.6
monotonicity_reg   = 1.0
monotonicity_margin = 0.0
tanh_output_head_scale = 30.0
anchor_loss_weight = 0.01        # post-training spline-fit weight; NOT a training target
anchor_target_score = "PER-ROW (multi-band)"
anchor_step_p      = 0.05
hidden             = 128
n_hidden_layers    = 2
per_sample_alpha_head = true
epochs             = 200
pairs_per_epoch    = 50000
lr                 = 0.001
l2                 = 0.0001
leaky_alpha        = 0.01
target_column      = "human_score"   # per-group normalized to [0,1] — see V32 commit 2f12a27
target_scale       = 1.0
max_features       = 372
minibatch_size     = 32
val_aggregate      = "geomean3"
out_dtype          = "f32"

# Group weights are train_w:val_w. cid22:1.5/2.0 and konjnd:1.2/1.5 are
# the values explicitly documented in the V32 ship commit 2f12a27.
groups = [
    { name = "safesyn",      path = "{canonical}/safesyn.parquet",          train_w = 1.0, val_w = 0.5 },
    { name = "cid22_train",  path = "{canonical}/cid22_train_norm.parquet", train_w = 1.5, val_w = 2.0 },
    { name = "kadid",        path = "{canonical}/kadid.parquet",            train_w = 0.5, val_w = 1.0 },
    { name = "tid",          path = "{canonical}/tid.parquet",              train_w = 0.5, val_w = 1.0 },
    { name = "konjnd_dense", path = "{canonical}/konjnd-dense-norm.parquet", train_w = 1.2, val_w = 1.5 },
]

auto_transforms = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
anchor_parquet  = "{canonical}/multiband_anchor_dial100.parquet"

command = """
$TRAIN \\
  --group safesyn:$CANON/safesyn.parquet:1.0:0.5 \\
  --group cid22_train:$CANON/cid22_train_norm.parquet:1.5:2.0 \\
  --group kadid:$CANON/kadid.parquet:0.5:1.0 \\
  --group tid:$CANON/tid.parquet:0.5:1.0 \\
  --group konjnd_dense:$CANON/konjnd-dense-norm.parquet:1.2:1.5 \\
  --hidden 128 --n-hidden-layers 2 --per-sample-alpha-head --epochs 200 \\
  --lr 0.001 --l2 0.0001 --seed 17 --target-column human_score --max-features 372 \\
  --auto-transforms $TXFORM \\
  --val-aggregate geomean3 --out-dtype f32 \\
  --mse-weight 0.6 --ranknet-weight 0.6 --monotonicity-reg 1.0 \\
  --tanh-output-head-scale 30.0 \\
  --anchor-parquet $CANON/multiband_anchor_dial100.parquet \\
  --anchor-loss-weight 0.01 --anchor-step-p 0.05 \\
  --minibatch-size 32 --log-every 25 --out $OUT_V32
"""

steps = [
    "1. zensim_mlp_train (command above) produces v32_cidmax_rn06_seed17_2026-05-25.bin (sha256 fde3b53a…)",
    "2. scripts/inject_spline.sh injects `zentrain.output_calibration_spline` (PCHIP 3-knot) producing the final v39 bake",
]

[inputs.canonical_root]
