[promotion]
profile           = "ZensimProfile::A"
deprecated_alias  = "ZensimProfile::PreviewV0_3"
shipped_in_commit = "a109680"
notes = """
KNOWN LIMITS (intentional / accepted; tracked in metric_invariants.rs):
- V39's MLP is non-monotone off its natural-photo training manifold;
  on heavily-OOD synthetic content (mandelbrot, checker, smooth gradients
  with large distortion), heavier degradation can produce a HIGHER pinned
  output → score ties at the upper clamp (100) for degraded/identical.
  Asserted in tests/metric_invariants.rs::v39_known_limit_violations.
- G5 (KonJND HF-rank) FAILS the 0.70 floor — characterized Pareto limit
  (single-MLP v42, 2-bake-ensemble v43, MoE v44 all falsified).
- AIC-4 lone win by V0_3 (paired bootstrap p=0.001) is a holdout-only
  generalization lottery; not closable by recipe alone.
"""
