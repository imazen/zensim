# RECIPE (not a bake record). Collapsed 2026-07-15 from 3 seed-fork manifests
# (v49_k025_s<N> for N in [7, 31]) which differed ONLY in `seed` and `[bake].file`.
# Both are CLI arguments — the manifest supplies DEFAULTS and explicit flags win
# (zensim_mlp_train.rs:1013). Run a seed with:
#
#   zensim_mlp_train --manifest zensim/weights/manifests/v49_k025.toml \
#       --seed <N> --out <path>.bin
#
# `seed` / `[bake].file` / `[bake].sha256` are deliberately absent: a recipe
# describes HOW to train, not one bake. See
# scripts/canonical_corpus/collapse_seed_fork_manifests_2026-07-15.py
[bake]
name = "v49-k025 (v47 recipe + one data-group delta, FIXED trainer)"
internal_version = "v47-strict-qat"
n_inputs = 372
arch = "372 → 128 → 64 + per-sample-α + tanh-pin(scale=30), masked-monotone (W1≥0 on sign-safe set, rank_w≤0); f16+zerobias encoder + f32 identity passthrough; spline + pack done IN-PASS (QAT-native, no post-step)"
date = "2026-05-27"

[training]
trainer = "zensim_mlp_train"
trainer_commit = "d8c8d64ff46989def512d96aeb5dbda84b0ae50a"
mse_weight = 0.6
ranknet_weight = 0.6
monotonicity_reg = 1.0
tanh_output_head_scale = 30.0
anchor_loss_weight = 0.01
anchor_step_p = 0.05
hidden = 128
n_hidden_layers = 2
per_sample_alpha_head = true
epochs = 200
lr = 0.001
l2 = 0.0001
target_column = "human_score"
target_scale = 1.0
max_features = 372
minibatch_size = 32
val_aggregate = "geomean3"
out_dtype = "f16"
monotone_cbc = true
monotone_strict = true
qat_fine_tune_epochs = 40
qat_tau = 0.005
monotone_feature_mask = "../../../benchmarks/feature_sign_mask_2026-05-26.tsv"
auto_transforms = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
anchor_parquet = "{canonical}/multiband_anchor_dial100.parquet"
steps = [ "1. zensim_mlp_train --manifest (this file) produces the FINAL packed+calibrated bake in ONE pass — no Python post-steps:", "   - last 40 epochs train quantization-aware (f16+zerobias STE) → net robust to packing", "   - post-training spline fit (fit_monotone_spline) on the QUANTIZED net over the multiband anchor → dial calibrated to exactly what ships", "   - bake stores f16 (encoder) + compressed → ~30 KB, identity-exact, monotone-by-construction", "   recal_v47_dial.py + pack_and_calibrate.py are OBSOLETE for this recipe (kept only for non-QAT bakes).",]
[[training.groups]]
name = "safesyn"
path = "{canonical}/safesyn.parquet"
train_w = 1.0
val_w = 0.5

[[training.groups]]
name = "cid22_train"
path = "{canonical}/cid22_train_norm.parquet"
train_w = 1.5
val_w = 2.0

[[training.groups]]
name = "kadid"
path = "{canonical}/kadid.parquet"
train_w = 0.5
val_w = 1.0

[[training.groups]]
name = "tid"
path = "{canonical}/tid.parquet"
train_w = 0.5
val_w = 1.0

[[training.groups]]
name = "konjnd_dense"
path = "{canonical}/konjnd-dense-norm.parquet"
train_w = 1.2
val_w = 1.5

[[training.groups]]
name = "kadis"
path = "/mnt/v/output/zensim-multicodec-probe/kadis_cvvdp_train.parquet"
train_w = 0.25
val_w = 0.0

[inputs.canonical_root]
local = "/mnt/v/zen/zensim-training/canonical-2026-05-21/train"
r2 = "s3://zentrain/canonical-2026-05-21/train"
tower = "/mnt/tower/output/zensim-archive-2026-05-20/canonical-2026-05-21/train"

