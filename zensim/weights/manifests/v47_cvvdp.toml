[eval]
verdict_file  = "../../../benchmarks/v47_cvvdp_target_FALSIFIED_2026-05-27.md"
# FALSIFIED — worse than the shipped v47-ssim2 on EVERY corpus + EVERY panel
# stat (reproduces the V41 scalar-CVVDP dead end). DO NOT SHIP.
cid22_srocc   = 0.6963   # vs ssim2-target 0.8657 (−0.169)
kadid_srocc   = 0.7101   # vs 0.7933
tid_srocc     = 0.6799   # vs 0.7927
konjnd_srocc  = 0.3288   # vs 0.4185
aic3_srocc    = 0.6098   # vs 0.7680
aic4_srocc    = 0.5810   # vs 0.8854 (−0.304)
g1_dial       = 0.58     # vs ssim2-target 0.97 (p5=−47.1 p95=70.3 — dial doesn't reach top)
notes = "FALSIFIED. Scalar-CVVDP-target produces a strictly worse metric than ssim2-target on all 6 held-out corpora across the full Mohammadi panel — emulating CVVDP's scalar OUTPUT != having its CSF mechanism (V41 reproduced: CID22 0.696 ~ V41's 0.66). The diffmap use case would need SPATIAL cvvdp-diffmap supervision (data we don't have), NOT scalar-target. See benchmarks/v47_cvvdp_target_FALSIFIED_2026-05-27.md."
