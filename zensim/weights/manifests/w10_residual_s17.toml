# [bake].sha256 / file_bytes were INHERITED from v47_strict_qat.toml by
# fork-and-edit and described the shipped Profile A bake, not this one
# (128 of 142 manifests carried the same wrong hash). Repaired 2026-07-15
# by scripts/canonical_corpus/fix_inherited_bake_provenance_2026-07-15.py.
# The inherited [eval] block was removed for the same reason: it was a
# copy of v47's numbers (cid22_srocc = 0.8657), not this recipe's.
# Enforced now by zensim-validate/tests/shipped_bake_provenance.rs.
[bake]
name = "wave3 t1dro on v51 corpus"
internal_version = "v47-strict-qat"
file = "/mnt/v/output/zensim-multicodec-probe/w10_residual_s17.bin"
sha256 = "c4a53b3fd3de709629f96df0b5d0cabb63938be5d0c76c146ac891447004d0dd"
file_bytes = 25603
n_inputs = 372
arch = "372 → 128 → 64 + per-sample-α + tanh-pin(scale=30), masked-monotone (W1≥0 on sign-safe set, rank_w≤0); f16+zerobias encoder + f32 identity passthrough; spline + pack done IN-PASS (QAT-native, no post-step)"
date = "2026-05-27"

[training]
trainer = "zensim_mlp_train"
trainer_commit = "731cf0eb2f346b356f63024fb1df78881e4353e2"
seed = 17
mse_weight = 0.6
ranknet_weight = 0.6
monotonicity_reg = 1.0
tanh_output_head_scale = 30.0
hidden = 128
n_hidden_layers = 2
per_sample_alpha_head = true
epochs = 200
lr = 0.001
l2 = 0.0001
target_column = "human_score"
target_scale = 1.0
max_features = 372
minibatch_size = 32
val_aggregate = "geomean3"
out_dtype = "f16"
monotone_cbc = true
monotone_strict = true
qat_fine_tune_epochs = 40
qat_tau = 0.005
monotone_feature_mask = "../../../benchmarks/feature_sign_mask_2026-05-26.tsv"
auto_transforms = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
steps = [ "1. zensim_mlp_train --manifest (this file) produces the FINAL packed+calibrated bake in ONE pass — no Python post-steps:", "   - last 40 epochs train quantization-aware (f16+zerobias STE) → net robust to packing", "   - post-training spline fit (fit_monotone_spline) on the QUANTIZED net over the multiband anchor → dial calibrated to exactly what ships", "   - bake stores f16 (encoder) + compressed → ~30 KB, identity-exact, monotone-by-construction", "   recal_v47_dial.py + pack_and_calibrate.py are OBSOLETE for this recipe (kept only for non-QAT bakes).",]
ema_decay = 0.9
hard_pair_frac = 0.5
hard_pair_max_delta = 0.05
stratified_bands = 10
dro_eta = 0.5
notes = "w10 RESIDUAL head: target = human_score - clip01(a*base+b) of the linear base (sha bdb5d63e...); NO anchor -> NO dial spline (ships raw residual preds). Composition: final = clip01(a*base+b) + residual. Eval ONLY composed."
[[training.groups]]
name = "bigres"
path = "/mnt/v/output/zensim-multicodec-probe/linear-probe/residual/bigcodec_traindigits_residual_2026-07-03.parquet"
train_w = 1.0
val_w = 0.5

[[training.groups]]
