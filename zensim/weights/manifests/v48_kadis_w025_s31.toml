# EXPERIMENT (2026-07-01): v47-strict-QAT recipe + KADIS-700k artificial-
# distortion group. The one untested combination from the KADIS probe cycle:
# cbc + tanh-pin + anchor-spline enforce a consistent, oriented, calibrated
# dial BY CONSTRUCTION (v47 dial mono 0.973 ~= the 0.980 oracle ceiling on the
# held-out KADIS safety grid), while the KADIS data adds the artificial-
# distortion rank coverage that lifted the probe bakes' Mohammadi panel
# everywhere (cvvdp_w1 beat A on 4/6 corpora but was regime-orientation-split
# and dial-flat — unusable as a dial). Everything except the added kadis group
# is byte-identical to v47_strict_qat.toml.
#
# kadis: 560k rows (source_id%10<8 train split of the GPU-metrics canonical),
# human_score = cvvdp/10 (range ~[0,1], 0.00% negative), 372 feats. KADID/TID
# remain in training per v47 (their eval numbers are train==val integrity
# guards); honest holdouts = CID22 49-ref val + AIC-3 + AIC-4 + held-out KADIS
# safety grid (source_id%10==9).
#
# Reproduce:  zensim_mlp_train --manifest zensim/weights/manifests/v48_kadis_experiment.toml

[bake]
name              = "v48-kadis experiment (v47-strict-QAT recipe + KADIS-700k group @0.25)"
internal_version  = "v48-kadis-exp"
file              = "/mnt/v/output/zensim-multicodec-probe/v48_kadis_w025_s31.bin"
sha256            = ""
file_bytes        = 0
n_inputs          = 372
arch              = "372 → 128 → 64 + per-sample-α + tanh-pin(scale=30), masked-monotone (W1≥0 on sign-safe set, rank_w≤0); f16+zerobias encoder + f32 identity passthrough; spline + pack IN-PASS (QAT-native)"
date              = "2026-07-01"

[training]
trainer            = "zensim_mlp_train"
seed               = 31
mse_weight         = 0.6
ranknet_weight     = 0.6
monotonicity_reg   = 1.0
tanh_output_head_scale = 30.0
anchor_loss_weight = 0.01
anchor_step_p      = 0.05
hidden             = 128
n_hidden_layers    = 2
per_sample_alpha_head = true
epochs             = 200
lr                 = 0.001
l2                 = 0.0001
target_column      = "human_score"
target_scale       = 1.0
max_features       = 372
minibatch_size     = 32
val_aggregate      = "geomean3"
out_dtype          = "f16"
monotone_cbc       = true
monotone_strict    = true
qat_fine_tune_epochs = 40
qat_tau            = 0.005
monotone_feature_mask = "../../../benchmarks/feature_sign_mask_2026-05-26.tsv"

groups = [
    { name = "safesyn",      path = "{canonical}/safesyn.parquet",          train_w = 1.0, val_w = 0.5 },
    { name = "cid22_train",  path = "{canonical}/cid22_train_norm.parquet", train_w = 1.5, val_w = 2.0 },
    { name = "kadid",        path = "{canonical}/kadid.parquet",            train_w = 0.5, val_w = 1.0 },
    { name = "tid",          path = "{canonical}/tid.parquet",              train_w = 0.5, val_w = 1.0 },
    { name = "konjnd_dense", path = "{canonical}/konjnd-dense-norm.parquet", train_w = 1.2, val_w = 1.5 },
    { name = "kadis",        path = "/mnt/v/output/zensim-multicodec-probe/kadis_cvvdp_train.parquet", train_w = 0.25, val_w = 0.0 },
]

auto_transforms = "../../../benchmarks/yeo_johnson_screen_widest_2026-05-25/screen_results_cross_corpus_safe.tsv"
anchor_parquet  = "{canonical}/multiband_anchor_dial100.parquet"

[inputs.canonical_root]
local = "/mnt/v/zen/zensim-training/canonical-2026-05-21/train"
r2    = "s3://zentrain/canonical-2026-05-21/train"
tower = "/mnt/tower/output/zensim-archive-2026-05-20/canonical-2026-05-21/train"

[inputs.safesyn]
path   = "{canonical}/safesyn.parquet"
sha256 = "ad15cc79cde156109d920bfade8ed465908e256fcd1cd8556b430791dcaf1b18"
rows   = 196086

[inputs.cid22_train]
path   = "{canonical}/cid22_train_norm.parquet"
sha256 = "59c9888ae3141545082fb58eafb19d1e964154cf79060b3d033e72ba8227c3ca"
rows   = 17611
notes  = "TRAINING-ONLY subset (201 refs disjoint from the 49-ref holdout). human_score = ssim2_gpu/100 — NOT human MOS (verified exact 2026-07-02; see docs/DATA_SPLITS.md). CID22 MCOS never trains."

[inputs.kadid]
