steps = [
    "1. zensim_mlp_train --manifest (this file) — one-pass packed+calibrated bake (QAT-native).",
    "2. bake_verdict on the default codec dial grid (auto-runs post-train).",
    "3. bake_verdict with ZENSIM_DIAL_GRID=kadis_test_safetygrid.parquet for held-out KADIS safety.",
    "4. Compare vs A: full Mohammadi panel + 10-band per-band + both dials + KonJND-no-regression gate.",
]
