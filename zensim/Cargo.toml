[package]
name = "zensim"
version = "0.3.0"
edition = "2024"
description = "Fast psychovisual image similarity metric"
repository = "https://github.com/imazen/zensim"
license = "MIT OR Apache-2.0"
readme = "../README.crates.md"
rust-version = "1.93.0"
keywords = ["image", "quality", "ssim", "perceptual", "similarity"]
categories = ["multimedia::images", "computer-vision"]
# Ship ONLY the source + the embedded bakes that `profile.rs` `include_bytes!`s
# — the `A` profile (v47-strict-QAT) plus the generation-B linear profiles
# (`B` SDR + `BHdr`) — and A's recipe. Every bake named here is loaded at
# compile time, so all three MUST ship or a packaged build fails. The raw
# pre-guard B ensemble (823 B) ships too so downstream can byte-reproduce B
# via `scripts/reproduce_b.sh` (recipe: benchmarks/profile_b_methodology_2026-07-12.md).
# The rest of `weights/` (archive bakes, picker checkpoints, historical/
# experimental bakes, other manifests) stays on disk for the workspace's
# research tooling but is NOT shipped to crates.io — every experimental bake
# now lives in the unpublished `zensim-experimental` crate. `Cargo.toml`, the
# `readme`, and license metadata are always included.
include = [
    "src/**/*.rs",
    "weights/v47_strict_qat_native_2026-05-27.bin",
    "weights/b_sdr_linear_cid80_inclwinsor_dense_dial_2026-07-07.bin",
    "weights/bhdr_linear_shaped_cvvdpmix_2026-07-12.bin",
    "weights/b_sdr_linear_cid80_anchored_2026-07-04.bin",
    "weights/c_sdr_mlp944_corrmix_2026-08-05.bin",
    "weights/manifests/v47_strict_qat.toml",
]

[package.metadata.docs.rs]
# Document the full opt-in surface (training / classification / zenpixels /
# custom-profiles). Default-feature docs would hide those APIs.
all-features = true

[features]
default = ["avx512", "imgref", "threads", "deprecated-profiles", "candidate-profiles"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
## Diagnostic ONLY: accumulate `Σ activity` during extraction so `ScaleStats::
## iw_mean_w` reports the factor the `1/n`-pooled `iw_*` features carry (they
## should be pooled `1/Σw`; see benchmarks/iw_pooling_normalization_2026-07-15.md).
## COST: NOT RESOLVED. An ad-hoc A/B first read +2.8% (23.01 vs 22.38 ms at
## 1024x1024), but repeating it 3x each gave OFF 23.42/27.68/29.68 and ON
## 27.00/28.78/23.64 — fully overlapping. That first number was noise, and the
## harness was the exact back-to-back-timing bias zenbench exists to kill. A
## paired zenbench run would be needed to resolve it. Gated anyway: OFF is
## zero-cost BY CONSTRUCTION, which beats an unmeasured cost, and the question
## it answers is settled (the pooling factor is a uniform 1.03-1.27x, too small
## to justify a re-extract). Default OFF. Adds only a sum; it CANNOT change any
## feature value, so on/off builds produce identical bakes.
iw-diagnostics = []
## Enable multi-threaded computation via rayon. Disable for wasm or single-threaded use.
threads = ["dep:rayon"]
## Exposes training/research API: ZensimConfig, try_score_from_features,
## WEIGHTS, FEATURES_PER_SCALE. These items control metric internals (blur
## kernel, scale count) whose outputs are incomparable with the default
## trained weights.
training = []
## Exposes classification API: classify(), ClassifiedResult, ErrorClassification,
## DeltaStats, AlphaStratifiedStats. Used by zensim-regress for regression testing.
classification = []
## Enable ImageSource impls for imgref::ImgRef<Rgb<u8>> and ImgRef<Rgba<u8>>.
imgref = ["dep:imgref", "dep:rgb"]
## Enable ImageSource adapter for zenpixels PixelSlice/PixelBuffer types.
## Automatically maps PixelDescriptor to correct format, alpha mode, and
## color primaries. Handles RGBX/BGRX (automatic opaque) and premultiplied
## alpha (un-premultiplied on the fly).
zenpixels = ["dep:zenpixels"]
## Enable the 80 MP OOM-relief integration test (`streaming_strips_oom_80mp`).
## Off by default because the test allocates ~500 MB of input pixels which
## is disruptive in default `cargo test --all` runs.
streaming_strips_oom = []
## Exposes the custom-profile extension point: `ZensimProfile::Custom`,
## `ProfileParams::builder()`, and `ProfileParamsBuilder`. Off by default —
## the `zensim-experimental` crate enables it to rebuild the historical
## research profiles; default consumers don't carry this surface.
custom-profiles = []
## Carries the DEPRECATED generation-A profile (`ZensimProfile::A`, the v47
## MLP codec-target bake). ON by default so existing code keeps compiling and
## `A` stays selectable — but `A` is `#[deprecated]`: new code should use
## `ZensimProfile::codec_target()` / `latest_preview()` (both now return the
## generation-B linear profile `B`) or name `ZensimProfile::B` directly.
## Disable via `--no-default-features` (re-add the other defaults you need) to
## drop `A` and its ~27 KB MLP bake entirely. A future minor release may move
## this feature out of `default`; migrate off `A` now.
deprecated-profiles = []
# Generation-C candidate profiles (C = 149 KB SDR MLP, CHdr = 180 KB HDR MLP).
# ON by default; size-sensitive builds drop them (`--no-default-features` +
# re-add what you need) to save ~329 KB of embedded bake bytes — the same
# opt-out shape as `deprecated-profiles` (A's ~27 KB v47 bake).
candidate-profiles = []
## Opt-in "bounded" v2 feature-extraction regime (`feature_v2` module,
## `Zensim::compute_v2_features`, `FeatureViewV2`). STRICTLY ADDITIVE — the
## default v1 372-feature extraction (`metric.rs`, `streaming.rs`) is byte-frozen
## and unaffected whether this feature is on or off; every canonical parquet and
## shipped bake depends on that freeze. v2 redesigns every feature to be
## BOUNDED (saturating/GMSD-style similarity forms, never a raw ratio),
## NORMALIZED (one weighted-mean convention, `WeightedPool::mean`, used for
## masked/IW/soft-peak alike), and SPATIALIZABLE (every feature is a mean of an
## explicit per-pixel map — including the deviation/"peak" signals that v1's
## max/L8 pooling could not express as a per-pixel map). See
## `docs/FEATURE_V2_SPEC_2026-07-18.md` for the full defect inventory (D1-D9),
## design principles, and per-feature formula/bound/citation table. Off by
## default: iteration 1 is a scalar correctness-first reference implementation
## (not yet fused into the archmage/SIMD streaming hot path), intended for
## validation and future trainer experiments, not for production throughput.
feature-regime-v2 = []

[dependencies]
archmage = { workspace = true }
bytemuck = { workspace = true }
magetypes = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
linear-srgb = { workspace = true }
imgref = { workspace = true, optional = true }
rgb = { workspace = true, optional = true }
zenpixels = { version = "0.2.11", default-features = false, features = ["std"], optional = true }
# Runtime for the `PreviewV0_3` MLP scorer. zenpredict is MIT/Apache-2.0
# (matching zensim), so the runtime dep is unconditional in 0.3.0+.
# Prior comments claiming AGPL referred to a license plan that was
# superseded before zenpredict's 0.1.0 publish.
zenpredict = { workspace = true }
# Cooperative cancellation (issue #48): the `Stop` trait is part of the
# public API (`Zensim::with_stop`, `ZensimError::Cancelled`).
enough = { workspace = true }

[dev-dependencies]
# jxl-encoder-family perceptual diffmap, for the RD block-selection comparison
# (rd_block_selection example). Matches the version zenavif deploys.
butteraugli = "0.9.3"
image = { workspace = true }
archmage = { workspace = true, features = ["testable_dispatch"] }
serde_json = "1"
# Phase-2 (feature-v2b) tooling: decode/resize/re-encode real corpus images
# through zen* crates instead of the `image` crate, per project convention
# (image::open/imageops::resize are only kept above for the pre-existing
# examples that already used them; new example/bench tooling uses these).
zenpng = { workspace = true }
zenpixels = { workspace = true }
zenresize = { workspace = true }
zenjpeg = { version = "0.8.4", default-features = false, features = ["decoder"] }
# Pins the shipped Profile C weight bytes (profile_c_tests::weight_sha256_pinned).
# Same version zensim-validate already uses in this workspace.
sha2 = "0.11.0"

[lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("training", "imgref", "classification", "zenpixels", "threads", "streaming_strips_oom", "custom-profiles", "feature-regime-v2"))']

[dev-dependencies.zenbench]
version = "0.1.8"

[[example]]
name = "fused_compare_bench"
required-features = ["custom-profiles"]

# Issue #50 top-cliff decomposition instrument (score vs pre-spline raw).
