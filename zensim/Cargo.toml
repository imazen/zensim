[package]
name = "zensim"
version = "0.2.7"
edition = "2024"
description = "Fast psychovisual image similarity metric"
repository = "https://github.com/imazen/zensim"
license = "MIT OR Apache-2.0"
readme = "../README.md"
rust-version = "1.89.0"
keywords = ["image", "quality", "ssim", "perceptual", "similarity"]
categories = ["multimedia::images", "computer-vision"]
exclude = ["benches/", "tests/", "CLAUDE.md", "CONTEXT-HANDOFF.md", "FEEDBACK.md", ".claude/", ".superwork/", ".zenbench/", "copter-report/", ".github/", "Cross.toml", "justfile", "Cargo.toml.original.txt", "fuzz/"]

[features]
default = ["avx512", "imgref", "threads"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
## Enable multi-threaded computation via rayon. Disable for wasm or single-threaded use.
threads = ["dep:rayon"]
## Exposes training/research API: ZensimConfig, score_from_features, WEIGHTS,
## FEATURES_PER_SCALE. These items control metric internals (blur kernel,
## scale count) whose outputs are incomparable with the default trained weights.
training = []
## Exposes classification API: classify(), ClassifiedResult, ErrorClassification,
## DeltaStats, AlphaStratifiedStats. Used by zensim-regress for regression testing.
classification = []
## Enable ImageSource impls for imgref::ImgRef<Rgb<u8>> and ImgRef<Rgba<u8>>.
imgref = ["dep:imgref", "dep:rgb"]
## Enable ImageSource adapter for zenpixels PixelSlice/PixelBuffer types.
## Automatically maps PixelDescriptor to correct format, alpha mode, and
## color primaries. Handles RGBX/BGRX (automatic opaque) and premultiplied
## alpha (un-premultiplied on the fly).
zenpixels = ["dep:zenpixels"]
## Enable high-quality downscale filters (Mitchell, Lanczos) for pyramid construction.
## Uses zenresize for resampling — training/research feature.
## Commented out: zenresize not yet published to crates.io.
# zenresize = ["dep:zenresize"]
## Internal experiment: replace runtime active_channels dispatch with a
## hardcoded const result for the default V0_2 weights. Used to measure
## whether dispatch overhead is on the critical path.
zwe-static-dispatch = []
## Internal experiment: swap the v4 SSIM kernel for a const-generic version
## with M=MINIMAL_SSIM (only ssim_d active). Measures the upper bound of
## what's saveable by eliding dead accumulators inside the SIMD loop.
## Output is incorrect — for timing only.
zwe-minimal-kernel = []
## Internal experiment: per-(scale,channel) const-mask dispatch into the v4
## SSIM kernel using the actual V0_2 active-feature set per cell. Output is
## correct.
zwe-inner-elide = []
## Prints H-blur and V-blur timings for a single compute call. Useful for
## bandwidth/critical-path inspection. Output is correct, but the prints
## destroy benchmark accuracy.
zwe-time-phases = []
## Internal experiment: swap default WEIGHTS to a pruned V0_2 variant where
## SSIM weights of low-mass cells (0X, 0B, 1X, 2X) are zeroed, flipping
## need_ssim=false for those cells. Bench-only — switches default profile
## without going through ZensimProfile API.
zwe-pruned-v0-2 = []
## STRIP_INNER tuning. Default is 32 (Goldilocks: L2-friendly, low overlap).
## Set zwe-strip-inner-16 for the original tight-L2 baseline.
## Set zwe-strip-inner-64 for largest strips (best at <1080p single-thread,
## regresses on 1080p multithread due to L2 spill on Zen 4).
zwe-strip-inner-16 = []
zwe-strip-inner-64 = []
## σ-plane elimination: streaming SSIM kernel (row-major) that stores σ_sq
## and σ_12 in a (2r+1)-row ring buffer rather than full-strip planes.
## Drops ~30 MB of memory traffic per image. Scalar implementation (SIMD
## variants are followup); gated for benchmarking against the existing
## fused 4-plane kernel.
zwe-streaming-ssim = []

[dependencies]
archmage = { workspace = true }
bytemuck = { workspace = true }
magetypes = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
linear-srgb = { workspace = true }
imgref = { workspace = true, optional = true }
rgb = { workspace = true, optional = true }
zenpixels = { version = "0.2.10", optional = true, default-features = false }
# zenresize = { workspace = true, optional = true }  # re-enable when published

[dev-dependencies]
image = { workspace = true }
archmage = { workspace = true, features = ["testable_dispatch"] }
serde_json = "1"

[lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("zenresize", "training", "imgref", "classification", "zenpixels", "threads"))']  # zenresize kept in check-cfg for gated code
