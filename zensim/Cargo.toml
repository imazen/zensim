[package]
name = "zensim"
version = "0.3.0"
edition = "2024"
description = "Fast psychovisual image similarity metric"
repository = "https://github.com/imazen/zensim"
license = "MIT OR Apache-2.0"
readme = "../README.md"
rust-version = "1.93.0"
keywords = ["image", "quality", "ssim", "perceptual", "similarity"]
categories = ["multimedia::images", "computer-vision"]
# Source plus the bakes `profile.rs` embeds. Every `include_bytes!("../weights/…")`
# in `src/` must be listed here or the published crate does not compile.
include = [
    "src/**/*.rs",
    "weights/rev7_mix_h128_2026-11-03.bin",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["avx512", "imgref", "threads"]
## Opt in to the 0.1/0.2 linear profiles for score continuity.
legacy-models = []
avx512 = ["archmage/avx512", "magetypes/avx512"]
## Enable multi-threaded computation via rayon. Disable for wasm or single-threaded use.
threads = ["dep:rayon"]
## Exposes training/research API: ZensimConfig, score_from_features, WEIGHTS,
## FEATURES_PER_SCALE. These items control metric internals (blur kernel, scale
## count) whose outputs are incomparable with the default trained weights.
training = ["legacy-models"]
## Exposes classification API: classify(), ClassifiedResult, ErrorClassification,
## DeltaStats, AlphaStratifiedStats. Used by zensim-regress for regression testing.
classification = []
## Enable ImageSource impls for imgref::ImgRef<Rgb<u8>> and ImgRef<Rgba<u8>>.
imgref = ["dep:imgref", "dep:rgb"]
## Enable ImageSource adapter for zenpixels PixelSlice/PixelBuffer types.
## Automatically maps PixelDescriptor to correct format, alpha mode, and
## color primaries. Handles RGBX/BGRX (automatic opaque) and premultiplied
## alpha (un-premultiplied on the fly).
zenpixels = ["dep:zenpixels"]

[dependencies]
archmage = { workspace = true }
bytemuck = { workspace = true }
magetypes = { workspace = true }
libm = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
linear-srgb = { workspace = true }
imgref = { workspace = true, optional = true }
rgb = { workspace = true, optional = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"], optional = true }
# MLP runtime for the trained profiles (ZNPR v3 bakes).
zenpredict = { workspace = true }
# Cooperative cancellation: `Zensim::with_stop`, `ZensimError::Cancelled`.
enough = { workspace = true }

[dev-dependencies]
zenbench = { workspace = true }
image = { workspace = true }
# Builds synthetic bakes for the layout tests; stripped from the published manifest.
# Unpublished; dev-only, so cargo removes it from the published manifest.
zenpredict-bake = { git = "https://github.com/imazen/zenanalyze", rev = "d291ba44170af9a65ec5cb8fd5ef0fa62f6409ba" }
archmage = { workspace = true, features = ["testable_dispatch"] }
# XXH3-128 for the cross-platform diffmap/feature goldens; git pin until 0.1.0 ships.
zenhash = { git = "https://github.com/imazen/zenhash", rev = "ce2bbdf669b90513d30d8dd86ad764ee3de68c6e", default-features = false, features = ["std"] }
serde_json = "1"

[lints.clippy]
uninlined_format_args = "allow"
too_many_arguments = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("training", "imgref", "classification", "zenpixels", "threads"))']

[[example]]
name = "split_parity_check"
required-features = ["training"]
