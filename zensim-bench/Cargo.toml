[package]
name = "zensim-bench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
training = ["zensim/training"]
# zenresize = ["zensim/zenresize"]

[build-dependencies]
cc = "1"

[dependencies]
# zensim-bench is internal tooling (not published) — flip
# `__experimental_versions` on so the V0_4 dispatch path and trained
# bake are reachable from the bench/example harnesses.
zensim = { workspace = true, features = ["threads", "avx512", "imgref", "__experimental_versions"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ssimulacra2 = "0.5"
fast-ssim2 = { version = "0.8.0", features = ["imgref"] }
butteraugli = { version = "0.9", features = ["avx512"] }
linear-srgb = { workspace = true , path = "../../linear-srgb" }
imgref = { workspace = true }
rgb = { workspace = true }
zenpnm = "0.1"
bytemuck = { workspace = true }
which = "8"
zenbench = { workspace = true }
zenpredict = { workspace = true }
csv = "1"
image = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "bench_compare"
harness = false

[[bench]]
name = "bench_zensim"
harness = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("zenresize", "training"))', 'cfg(has_cpp_ssimulacra2)', 'cfg(has_cpp_butteraugli)']
