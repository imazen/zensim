[package]
name = "zensim-bench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
training = ["zensim/training"]
# zenresize = ["zensim/zenresize"]

# Enables the `extract_features_372col_omni` example. Uses only the
# `image` crate's default decoders — supports JPEG, PNG, WebP. AVIF and
# JXL encoded variants are SKIPPED with a logged error. A full-coverage
# extractor would require zen-metrics-cli as a path dep, but that pulls
# in a conflicting zenjxl path (zenjxl vs zenjxl--main). Documented gap.
extract-omni = ["training", "dep:parquet", "dep:arrow"]

[build-dependencies]
cc = "1"

[dependencies]
# zensim-bench is internal tooling (not published).
zensim = { workspace = true, features = ["threads", "avx512", "imgref"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ssimulacra2 = "0.5"
fast-ssim2 = { version = "0.8.0", features = ["imgref"] }
butteraugli = { version = "0.9", features = ["avx512"] }
linear-srgb = { workspace = true }
imgref = { workspace = true }
rgb = { workspace = true }
zenpnm = "0.1"
bytemuck = { workspace = true }
which = "8"
zenbench = { workspace = true }
zenpredict = { workspace = true }
zenpredict-bake = { workspace = true }
csv = "1"
image = { workspace = true }
rayon = { workspace = true }

# Optional deps for the `extract-omni` feature. Uses image crate's
# native JPEG/PNG/WebP support. AVIF + JXL not supported (image 0.25
# only ships avif decode via dav1d system dep, no jxl); a future
# session can add zen-metrics-cli once the zenjxl path conflict
# (zenjxl vs zenjxl--main in the workspace dep graph) is resolved.
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"], optional = true }
arrow = { version = "58.3.0", default-features = false, optional = true }

[[bench]]
name = "bench_compare"
harness = false

[[bench]]
name = "bench_zensim"
harness = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("zenresize", "training"))', 'cfg(has_cpp_ssimulacra2)', 'cfg(has_cpp_butteraugli)']
