# CI-PROBE branch workflow — replaces the full matrix for the golden-flip
# experiment (benchmarks/v1_golden_env_triage_2026-08-05.md). DO NOT MERGE.
#
# Runs ONLY the v1 golden byte-identity test, 4 repeats on ubuntu-latest,
# logging the runner CPU per repeat: the ubuntu-latest fleet mixes Intel
# Xeon and AMD EPYC hosts and the flip is CPU-vendor-sensitive, so a
# single run proves nothing — read each repeat's verdict AGAINST its
# logged CPU. Checkout pins the PR HEAD sha (never the merge ref: the
# probe must test the 05739a53-era tree, not tip-merged code).
name: CI
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-probe:
    name: golden-probe (rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: runner CPU identity
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -qo avx512f /proc/cpuinfo && echo "avx512f: yes" || echo "avx512f: no"
          grep -m1 'vendor_id' /proc/cpuinfo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: archmage/magetypes lock versions (the experiment variable)
        run: grep -A1 'name = "archmage"' Cargo.lock | head -2; grep -A1 'name = "magetypes"' Cargo.lock | head -2
      # The golden tests are behind `--features training` (#![cfg(feature =
      # "training")]) — without it the target builds ZERO tests and green-lies.
      # The `running 2 tests` grep makes a silent no-op FAIL the probe.
      - name: v1 golden byte-identity (training feature)
        run: |
          cargo test -p zensim --features training --test v1_golden_bytes -- --nocapture 2>&1 | tee golden.log
          grep -q "running 2 tests" golden.log
      - name: v1 golden byte-identity (all features)
        if: always()
        run: |
          cargo test -p zensim --all-features --test v1_golden_bytes -- --nocapture 2>&1 | tee golden_all.log
          grep -q "running 2 tests" golden_all.log
