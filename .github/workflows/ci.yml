name: CI

# Started by hand (Actions tab or `gh workflow run ci.yml`), as for the research
# repository this crate was cut from.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast -- --nocapture

  test-all-features:
    name: Test all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast --all-features -- --nocapture

  i686:
    name: Test (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - name: Test on 32-bit
        env:
          CODEC_CORPUS_CACHE: /target/codec-corpus-cache
        run: cross test --target i686-unknown-linux-gnu --no-fail-fast -p zensim -p zensim-regress -- --nocapture

  feature-matrix:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check feature permutations
        run: |
          set -e
          features_list=(
            ""
            "avx512"
            "threads"
            "imgref"
            "training"
            "classification"
            "zenpixels"
            "avx512,threads"
            "threads,imgref"
            "training,classification"
            "avx512,threads,imgref,training"
            "avx512,threads,imgref,classification,zenpixels"
          )
          for features in "${features_list[@]}"; do
            if [ -z "$features" ]; then
              label="none"
              flags="--no-default-features"
            else
              label="$features"
              flags="--no-default-features --features $features"
            fi
            echo "::group::Clippy + test: $label"
            cargo clippy -p zensim $flags --lib -- -D warnings
            cargo test -p zensim $flags --lib -- --nocapture
            echo "::endgroup::"
          done

  corpus-tests:
    name: Corpus ICC tests
    runs-on: ubuntu-latest
    env:
      REGRESS_REFERENCE_URL: https://imageflow-resources.s3.amazonaws.com/test_inputs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zensim --test corpus_icc -- --ignored --nocapture

  wasm:
    name: WASM SIMD128 (profile golden scores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test under wasmtime
        run: cargo test --target wasm32-wasip1 -p zensim --no-default-features --test profiles -- --nocapture
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --dir=. --"
          RUSTFLAGS: "-C target-feature=+simd128"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo hack check --rust-version --workspace
