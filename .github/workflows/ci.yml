name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Catches scripts that cannot possibly run: pinned to a deleted sibling
  # worktree, shelling to a deleted script, or a README indexing a file that is
  # gone. On 2026-07-15, 68 of 316 were in that state — some for months —
  # because nothing ever asked. Cheap (no toolchain, no deps, ~1 s) and it only
  # inspects paths, so it is safe to gate every push on.
  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/lint_scripts.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --exclude zensim-wasm-tests -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
          - macos-26-intel
    env:
      REGRESS_MANIFEST_PATH: test-manifest.tsv
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast (2026-08-06, user-approved): run EVERY test target even
      # when one fails. Without it, cargo stops at the first failing target —
      # for three weeks the v1 golden pair's failure on non-AMD runners meant
      # zensim-validate's (and every later crate's) suites never executed on
      # those platforms, so red masked red and the true per-platform failure
      # inventory was unknown.
      - run: cargo test --workspace --no-fail-fast --exclude zensim-wasm-tests -- --nocapture
      - name: Upload test manifest
        uses: actions/upload-artifact@v7
        with:
          name: test-manifest-${{ matrix.os }}
          path: test-manifest.tsv
          if-no-files-found: ignore
        if: always()

  test-all-features:
    name: Test all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features would hardwire zensim-train-gpu's tests to the CUDA
      # backend (hosted runners have no GPU). The gpu crates run with the
      # CubeCL CPU backend instead — their aux kernels are still executed,
      # and the CUDA/WGPU backends are compile-checked by the Clippy job.
      # --no-fail-fast on both halves (2026-08-06, user-approved) — same
      # rationale as the test job: a first-target failure must not hide the
      # rest of the suite from the per-platform inventory.
      - run: cargo test --workspace --no-fail-fast --all-features --exclude zensim-wasm-tests --exclude zensim-validate --exclude zensim-train-gpu -- --nocapture
      - run: cargo test --no-fail-fast -p zensim-validate -p zensim-train-gpu --features zensim-validate/gpu-cpu,zensim-train-gpu/gpu-cpu -- --nocapture

  feature-matrix:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check all feature permutations
        run: |
          set -e
          features_list=(
            ""
            "avx512"
            "imgref"
            "training"
            "classification"
            "zenpixels"
            "avx512,imgref"
            "avx512,training"
            "avx512,classification"
            "avx512,zenpixels"
            "imgref,training"
            "imgref,classification"
            "imgref,zenpixels"
            "training,classification"
            "avx512,imgref,training"
            "avx512,imgref,classification"
            "avx512,imgref,zenpixels"
            "avx512,training,classification"
            "imgref,training,classification"
            "avx512,imgref,training,classification"
            "avx512,imgref,training,classification,zenpixels"
            "imgref,classification"
            # custom-profiles/feature-regime-v2 axes — absent from this list
            # until 2026-08-05, which is why the feature-regime-v2-only
            # E0433 (feature_v2.rs referencing the custom-profiles-gated
            # attribution module; flagged in 87c5e9ef) shipped uncaught.
            # Three points cover the interaction class: each feature alone,
            # and the fused-entry pair (af4417f8's both-features rule).
            "custom-profiles"
            "feature-regime-v2"
            "custom-profiles,feature-regime-v2"
          )
          for features in "${features_list[@]}"; do
            if [ -z "$features" ]; then
              label="none"
              flags="--no-default-features"
            else
              label="$features"
              flags="--no-default-features --features $features"
            fi
            echo "::group::Clippy + test: $label"
            cargo clippy -p zensim $flags --lib -- -D warnings
            cargo test -p zensim $flags --lib -- --nocapture
            echo "::endgroup::"
          done

  corpus-tests:
    name: Corpus ICC tests
    runs-on: ubuntu-latest
    env:
      REGRESS_REFERENCE_URL: https://imageflow-resources.s3.amazonaws.com/test_inputs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zensim --test corpus_icc -- --ignored --nocapture

  wasm:
    name: WASM SIMD128
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test under wasmtime
        run: |
          cargo test --target wasm32-wasip1 -p zensim-wasm-tests -- --nocapture
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --dir=. --"
          RUSTFLAGS: "-C target-feature=+simd128"

  i686:
    name: Test (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    # Bring-up mode: non-blocking until proven green, then remove this line so it
    # gates like every other platform (i686 is a primary target per workspace policy).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - name: Test published crates on 32-bit
        env:
          # codec-corpus resolves its cache through `dirs::cache_dir()`, which
          # is not writable inside the cross container (the zensim-regress
          # orientation tests died with PermissionDenied). Point it at the
          # mounted target dir; `Cross.toml` passes the variable through.
          CODEC_CORPUS_CACHE: /target/codec-corpus-cache
        run: cross test --target i686-unknown-linux-gnu --no-fail-fast -p zensim -p zensim-regress -- --nocapture

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo hack check --rust-version --workspace --exclude zensim-validate --exclude zensim-wasm-tests

  no-leakage:
    name: zensim-regress public API leakage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Forbid zen-ecosystem types in zensim-regress public API
        run: |
          set -euo pipefail
          # Capture the full public API surface (including pub re-exports
          # and reachable trait bounds).
          api=$(cargo public-api -p zensim-regress)
          echo "$api"
          # Forbidden type prefixes — these crates would force a downstream
          # consumer of zensim-regress to share the same major (or 0.x) version
          # we depend on, breaking any project that pins a different version.
          # `zensim::` is intentionally allowed: zensim-regress is the regression
          # layer for zensim and shares its semver lifecycle.
          forbidden=(
            "zenpixels::"
            "zenresize::"
            "zenpng::"
            "zenblend::"
            "enough::"
            "imgref::"
            "rgb::Rgba"
            "rgb::Rgb"
            "bytemuck::"
            " image::"
            "linear_srgb::"
          )
          fail=0
          for f in "${forbidden[@]}"; do
            if echo "$api" | grep -qF -- "$f"; then
              echo "::error::Forbidden type prefix '$f' appears in zensim-regress public API"
              echo "$api" | grep -F -- "$f" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::zensim-regress is leaking zen-ecosystem types in its public API."
            echo "Wrap such types behind the crate-internal pixel_ops module (see CLAUDE.md)."
            exit 1
          fi

  metric-census:
    name: Metric-column corruption census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install census deps
        run: pip install --quiet "pyarrow>=15" "numpy>=1.26" "pandas>=2"
      - name: Census must FAIL on the known-corrupt fixtures
        run: |
          set +e
          python3 scripts/canonical_corpus/audit_metric_columns.py \
            --fail-on-corruption \
            --paths \
              scripts/canonical_corpus/test_fixtures/corrupt_human_copy.parquet \
              scripts/canonical_corpus/test_fixtures/corrupt_ref_misjoin.parquet
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::census did NOT detect corruption in the known-corrupt fixtures"
            exit 1
          fi
          echo "census correctly flagged the corrupt fixtures (exit $rc)"
      - name: Census must PASS on the clean fixture
        run: |
          python3 scripts/canonical_corpus/audit_metric_columns.py \
            --fail-on-corruption \
            --paths scripts/canonical_corpus/test_fixtures/clean.parquet
      - name: Census of canonical train parquets (if mounted)
        run: |
          # CI runners do NOT have /mnt/v or R2 — this gate runs against the
          # committed fixtures above. When the canonical parquets ARE present
          # (e.g. a self-hosted runner with /mnt/v mounted), also census them.
          CANON=/mnt/v/zen/zensim-training/canonical-2026-05-21/train
          if [ -d "$CANON" ]; then
            python3 scripts/canonical_corpus/audit_metric_columns.py \
              --fail-on-corruption --root "$CANON"
          else
            echo "canonical train parquets not mounted ($CANON) — fixture gate only."
          fi

  join-safety:
    name: join_safety unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet "pyarrow>=15" "numpy>=1.26" "pandas>=2"
      - name: Run join_safety self-tests
        run: python3 scripts/canonical_corpus/test_join_safety.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same gpu-backend split as test-all-features (hosted runners have no
      # GPU); coverage accumulates across the two runs via --no-report.
      - run: cargo llvm-cov --no-report --workspace --all-features --exclude zensim-wasm-tests --exclude zensim-validate --exclude zensim-train-gpu
      - run: cargo llvm-cov --no-report -p zensim-validate -p zensim-train-gpu --features zensim-validate/gpu-cpu,zensim-train-gpu/gpu-cpu
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
