name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/v_next/build_site_data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Note: site/data/ is already committed (small JSONs), so no
      # need to regenerate at deploy time. If we later want nightly
      # regeneration from a hosted eval-log artifact, add the build
      # step here using build_site_data.py.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
