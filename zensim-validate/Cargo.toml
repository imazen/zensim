[package]
name = "zensim-validate"
version = "0.1.0"
edition = "2024"
description = "Validation harness: correlate zensim against human quality ratings"
license = "MIT"
publish = false

[features]
default = []

# GPU trainer dispatch (task #166). When enabled, `zensim_mlp_train`
# accepts `--gpu-runtime cuda` and routes the per-sample-α head training
# loop through `zensim-train-gpu`. Off by default so the existing CPU
# code path stays bit-identical and machines without CUDA can still
# build the validate crate.
gpu-cuda = ["zensim-train-gpu/gpu-cuda"]
gpu-wgpu = ["zensim-train-gpu/gpu-wgpu"]
gpu-cpu  = ["zensim-train-gpu/gpu-cpu"]

[dependencies]
zensim = { path = "../zensim", features = ["training"] }
zensim-experimental = { path = "../zensim-experimental" }
zensim-train-core = { path = "../zensim-train-core" }
zensim-train-gpu = { path = "../zensim-train-gpu" }
zenpredict = { workspace = true }
zenpredict-bake = { workspace = true }
zenstats = { workspace = true }
archmage = { workspace = true }
magetypes = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
csv = "1"
calamine = "0.34"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
glob = "0.3"
cmaes = { version = "0.2", default-features = false }
anyhow = "1"
memmap2 = "0.9.10"
memchr = "2.8.0"
fast-float2 = "0.2.3"
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }
arrow = { version = "58.3.0", default-features = false }
# --manifest reproduce-this input mode for zensim_mlp_train (train_manifest.rs).
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"

[dev-dependencies]
zenbench = { workspace = true }

[[bench]]
name = "adam_bench"
path = "benches/adam_bench.rs"
harness = false

[[bench]]
name = "bench_mlp_kernels"
path = "benches/bench_mlp_kernels.rs"
harness = false
