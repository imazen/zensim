[package]
name = "zensim-train-gpu"
version = "0.0.1"
edition = "2024"
rust-version = "1.93.0"
description = "GPU-accelerated MLP trainer for zensim per-sample-α head (Phase 1: CubeCL forward + backprop)"
license = "MIT"
publish = false

# Phase 1 MVP per task #166 (2026-05-19):
# - Per-sample-α head architecture only (n_features → n_hidden → 2-head mix)
# - RankNet pair loss + MSE pair loss + monotonicity hinge (no auxiliary losses)
# - Adam optimizer mirrors CPU AdamState
# - K-batched (default K=512) for GPU saturation
# - Output: PerSampleAlphaHeadModel (same shape as CPU), bakeable via existing
#   zensim_train_core::per_sample_alpha_head::bake_per_sample_alpha_head_v3
#
# CPU code path stays bit-identical when `gpu-cuda` feature is off — this
# crate is *additive* to the existing trainer. The `zensim_mlp_train`
# binary opts in via `--gpu-runtime cuda`.

[features]
default = []
# Enable CubeCL CUDA backend. Builds against a system CUDA install
# via cubecl-cuda's dlopen. Off by default so machines without CUDA
# can still build the crate (the train_per_sample_alpha_head_gpu
# function will then panic at runtime with a clear error).
gpu-cuda = ["dep:cubecl", "cubecl/cuda"]
# Optional WGPU backend (cross-vendor). Not the primary Phase 1 target.
gpu-wgpu = ["dep:cubecl", "cubecl/wgpu"]
# Optional CPU backend (cubecl-cpu via tracel-mlir) — useful for
# parity testing on machines without a GPU.
gpu-cpu  = ["dep:cubecl", "cubecl/cpu"]

[dependencies]
zensim-train-core = { path = "../zensim-train-core" }
cubecl = { version = "0.10.0-pre.4", default-features = false, features = ["std"], optional = true }

[lints.clippy]
uninlined_format_args = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("gpu-cuda", "gpu-wgpu", "gpu-cpu"))']
